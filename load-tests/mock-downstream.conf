server {
    listen 8081;
    default_type application/json;

    location /orders/ {
        return 200 '{"orderId":"ORD-100","email":"rahim@example.com","phone":"01712345678","nid":"1998765432"}';
    }

    location /refunds {
        return 200 '{"refunded":true,"status":"OK"}';
    }

    # QA5: the "new" REST service a developer puts behind the gateway (Invoice API)
    location /invoices/ {
        return 200 '{"invoiceId":"INV-2026-001","customerEmail":"karim.billing@example.com","amount":1250,"currency":"BDT","status":"PAID"}';
    }

    location /payouts {
        return 200 '{"payoutId":"PAY-777","contact":"finance@example.com","phone":"+8801819876543"}';
    }

    location /health {
        return 200 '{"status":"UP"}';
    }
}
