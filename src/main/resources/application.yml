spring:
  application:
    name: agentgate
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: agentgate-mcp-gateway
        version: 1.0.0
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agentgate}
    username: ${SPRING_DATASOURCE_USERNAME:agentgate}
    password: ${SPRING_DATASOURCE_PASSWORD:agentgate_dev_secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        agentgate.gateway.overhead: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

agentgate:
  security:
    jwt-secret: ${AGENTGATE_SECURITY_JWT_SECRET:agentgate-default-dev-hmac-sha256-secret-key-minimum-32-bytes}
    access-token-ttl: 1h
    admin-username: ${AGENTGATE_ADMIN_USERNAME:user}
    admin-password: ${AGENTGATE_ADMIN_PASSWORD:password}
    approver-username: ${AGENTGATE_APPROVER_USERNAME:approver}
    approver-password: ${AGENTGATE_APPROVER_PASSWORD:approver-dev-pass}
    auditor-username: ${AGENTGATE_AUDITOR_USERNAME:auditor}
    auditor-password: ${AGENTGATE_AUDITOR_PASSWORD:auditor-dev-pass}
  policy:
    refresh-interval: 10s
    low-risk-failsafe-ttl: 5m
    default-decision-deny: true
  approval:
    default-timeout: 15m
    webhook-timeout: 3s
  guards:
    max-response-bytes: 65536
    truncation-notice: "[TRUNCATED BY AGENTGATE GUARD: payload exceeded maximum permitted size]"
  limits:
    default-requests-per-minute: 60
    default-daily-quota: 5000
    default-write-blast-radius-per-hour: 20
  audit:
    hmac-secret: ${AGENTGATE_AUDIT_HMAC_SECRET:dev-only-override-in-env-audit-hmac-key}
