# ----------------------------------------------------------------------------
# Base configuration shared by every profile (Requirement C2).
# Secrets have NO defaults here: they come from environment variables (Docker
# Compose, CI) or from a git-ignored .env file in the working directory, which
# is imported below for local runs. Copy .env.example to .env to get started.
# Profiles: dev (default for local runs), docker (docker compose), test (JUnit).
# ----------------------------------------------------------------------------
spring:
  application:
    name: agentgate
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    default: dev
  autoconfigure:
    # Agent tokens are HS256-signed by the gateway's own JwtEncoder (FR2), so Spring Authorization
    # Server needs no generated RSA key pair and no published JWK Set
    exclude: org.springframework.boot.security.oauth2.server.authorization.autoconfigure.servlet.OAuth2AuthorizationServerJwtAutoConfiguration
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: agentgate-mcp-gateway
        version: 1.0.0
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:agentgate}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:agentgate}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      # QA4: fail fast instead of blocking for Hikari's 30 s default when PostgreSQL is unreachable,
      # and never wait forever on a half-open connection
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        socketTimeout: 30
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        agentgate.gateway.overhead: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

agentgate:
  security:
    jwt-secret: ${AGENTGATE_SECURITY_JWT_SECRET}
    access-token-ttl: 1h
    admin-username: ${AGENTGATE_ADMIN_USERNAME:user}
    admin-password: ${AGENTGATE_ADMIN_PASSWORD}
    approver-username: ${AGENTGATE_APPROVER_USERNAME:approver}
    approver-password: ${AGENTGATE_APPROVER_PASSWORD}
    auditor-username: ${AGENTGATE_AUDITOR_USERNAME:auditor}
    auditor-password: ${AGENTGATE_AUDITOR_PASSWORD}
  policy:
    refresh-interval: 10s
    low-risk-failsafe-ttl: 5m
    default-decision-deny: true
    # QA4: how often and how patiently the policy store (PostgreSQL) is probed for an outage
    store-probe-interval: 2s
    store-probe-timeout: 1500ms
  approval:
    default-timeout: 15m
    webhook-timeout: 3s
    # Fallback approver webhook for high-risk tools without their own approvalWebhookUrl (FR4)
    default-webhook-url: ${AGENTGATE_APPROVAL_WEBHOOK_URL:}
  guards:
    max-response-bytes: 65536
    truncation-notice: "[TRUNCATED BY AGENTGATE GUARD: payload exceeded maximum permitted size]"
  limits:
    default-requests-per-minute: 60
    default-daily-quota: 5000
    default-write-blast-radius-per-hour: 20
    # FR6: at most one alert per agent, tool and breach type per cooldown; optional operations webhook
    alert-cooldown: 1m
    alert-webhook-url: ${AGENTGATE_LIMIT_ALERT_WEBHOOK_URL:}
  audit:
    hmac-secret: ${AGENTGATE_AUDIT_HMAC_SECRET}
  mcp:
    # How often the live MCP tool list is reconciled with the registry (FR1, FR10)
    tool-sync-interval: 5s
